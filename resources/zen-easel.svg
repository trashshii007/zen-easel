<!--
  Zen Easel's toolbar button, and nothing else now (chrome.css). Every other surface
  takes the product mark in zen-easel-board.svg.

  The lines are stroked with `context-fill`, not `context-stroke`; zen-easel-board.svg's
  header sets out why, and it holds for the toolbar button too.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20"
     fill="none" stroke="context-fill" stroke-opacity="context-fill-opacity"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- The board -->
  <rect x="2.25" y="3.25" width="15.5" height="11" rx="1.75"/>
  <!-- Easel legs -->
  <path d="M6.5 17 L9.25 14.25 M13.5 17 L10.75 14.25"/>
  <!-- Something pinned to it, and a stroke of ink -->
  <rect x="4.75" y="5.75" width="5" height="4" rx="0.9"/>
  <path d="M11.75 11.5 C 12.9 9.2, 14 8.4, 15.25 6.5"/>
</svg>
